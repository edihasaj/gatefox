<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GateFox share image</title>
<!-- Renders the 1200x630 share images with scripts/render-og-images.mjs. Not deployed.
     Query: ?kicker=&title=&lead=&route=1 -->
<style>
  :root { --paper: #f6f3eb; --deep: #e7e9dd; --ink: #18201b; --muted: #566359; --orange: #ba3c19; --moss: #426258; --line: #d4d8c9; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: var(--ink); font-family: "Avenir Next", Avenir, sans-serif;
    background:
      radial-gradient(760px 520px at 92% 18%, rgba(255,255,255,0.75), transparent 62%),
      radial-gradient(820px 520px at -6% 108%, var(--deep), transparent 70%),
      var(--paper);
  }
  body::after { content: ""; position: absolute; inset: 0; border-top: 10px solid var(--orange); pointer-events: none; }
  .copy { position: absolute; left: 80px; top: 74px; bottom: 64px; width: 700px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; font: 700 34px/1 "Avenir Next", sans-serif; letter-spacing: -0.01em; }
  .brand img { width: 58px; height: 58px; object-fit: contain; }
  .kicker { margin-top: 46px; font: 600 17px/1 "SF Mono", "SFMono-Regular", Menlo, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--moss); }
  h1 { margin-top: 18px; font: 400 76px/1.02 Baskerville, "Palatino Linotype", serif; letter-spacing: -0.035em; text-wrap: balance; }
  h1.long { font-size: 60px; }
  p { margin-top: 24px; font-size: 27px; line-height: 1.38; color: var(--muted); max-width: 640px; text-wrap: pretty; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .route { margin-top: 30px; display: flex; align-items: center; gap: 14px; font-size: 19px; color: var(--moss); }
  .route span { border: 1.5px solid #bdc7b6; border-radius: 30px; padding: 8px 18px; background: #eff0e5; }
  .route span.mid { border-color: var(--orange); color: var(--orange); background: #fbefe9; font-weight: 600; }
  .route[hidden] { display: none; }
  .domain { margin-top: auto; padding-top: 22px; font: 500 21px/1 "SF Mono", Menlo, monospace; letter-spacing: 0.02em; color: var(--muted); }
  .domain b { color: var(--orange); font-weight: 600; }
  .fox { position: absolute; right: 64px; top: 128px; width: 330px; height: 330px; transform: rotate(5deg); filter: drop-shadow(0 26px 30px rgba(66, 98, 88, 0.22)); }
  .ring { position: absolute; right: 26px; top: 92px; width: 404px; height: 404px; border-radius: 50%; border: 1.5px dashed var(--line); }
</style>
</head>
<body>
  <div class="ring"></div>
  <img class="fox" src="../../docs/assets/logo.png" alt="">
  <div class="copy">
    <div class="brand"><img src="../../docs/assets/logo.png" alt=""><span>GateFox</span></div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p id="lead"></p>
    <div class="route" id="route" hidden><span>Codex · Claude Code</span>→<span class="mid">GateFox</span>→<span>Your accounts</span></div>
    <div class="domain"><b>gatefox.dev</b> · open source · macOS</div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('kicker').textContent = q.get('kicker') || 'Docs';
  const title = document.getElementById('title'); title.textContent = q.get('title') || 'GateFox';
  if (title.textContent.length > 34) title.classList.add('long');
  document.getElementById('lead').textContent = q.get('lead') || '';
  if (q.get('route') === '1') document.getElementById('route').hidden = false;
</script>
</body>
</html>
