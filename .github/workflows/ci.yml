name: CI
on:
  workflow_dispatch:
    inputs:
      run_build:
        description: Run hosted CI builds (paid)
        required: false
        default: false
        type: boolean
      run_native:
        description: Run paid macOS native checks
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/production' &&
          inputs.run_build == true }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Verify CI native-run policy
        run: node --test scripts/tests/ci-native-policy.test.mjs
      - run: npm test
  macos-native:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/production' &&
          inputs.run_build == true &&
          inputs.run_native == true }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify macOS service and SSH behavior
        run: >-
          node --test
          dist/tests/mac-service.test.js
          dist/tests/service-plan.test.js
          dist/tests/service-tunnel.test.js
          dist/tests/service-shared-executors.test.js
          dist/tests/service-shared-native.test.js
          dist/tests/native-execution-host.test.js
